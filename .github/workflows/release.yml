name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
      - run: npm view shopify-scope-guard version dist.integrity
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e5c5e3f
        with:
          generate_release_notes: true
