name: Feature request
description: Suggest a focused improvement to Scope Guard.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: shopify-evidence
    attributes:
      label: Shopify evidence or source
      description: If this concerns a scope or API surface, link the relevant official Shopify documentation.
    validations:
      required: false
