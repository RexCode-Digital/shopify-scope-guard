name: Bug report
description: Report a reproducible analyzer or action problem.
body:
  - type: input
    id: version
    attributes:
      label: Scope Guard version
      description: For example, 0.1.0 or a commit SHA.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal sanitized repository or fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Do not include tokens, credentials, private keys, or merchant data.
    validations:
      required: false
